<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobCollector</title>
    <link rel="stylesheet" href="/src/popup/popup.css" />
  </head>
  <body>
    <main class="collector-shell" aria-label="JobCollector 职位收集器">
      <button class="primary-action" id="collect" type="button">收集当前职位</button>

      <section class="count-card" aria-label="已收集职位数量">
        <strong id="job-count">已收集 0 个职位</strong>
      </section>

      <section class="job-list" aria-label="已收集职位">
        <div class="job-table-scroll">
          <table>
            <thead>
              <tr>
                <th scope="col">#</th>
                <th scope="col">公司</th>
                <th scope="col">职位</th>
              </tr>
            </thead>
            <tbody id="job-list">
              <tr>
                <td class="empty-list" colspan="3">暂无已收集职位</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <div class="secondary-actions">
        <button class="secondary-action" id="export" type="button">下载 CSV</button>
        <button class="danger-action" id="clear" type="button">清空</button>
      </div>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
