<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-labelledby="job-collector-icon-title job-collector-icon-desc">
  <title id="job-collector-icon-title">JOB 职位收集图标</title>
  <desc id="job-collector-icon-desc">黑色圆角方块内，上方是一条白色收入口，下方是醒目的白色粗体 JOB。</desc>

  <style>
    .job-collector-icon__tile {
      fill: #0a0a0a;
      vector-effect: non-scaling-stroke;
    }

    .job-collector-icon__slot,
    .job-collector-icon__label {
      fill: #ffffff;
      vector-effect: non-scaling-stroke;
    }

    .job-collector-icon__label {
      font-family: Geist, Inter, Arial, sans-serif;
      font-size: 62px;
      font-weight: 900;
      letter-spacing: -2px;
    }
  </style>

  <g class="job-collector-icon__object" data-boundary="app-tile">
    <rect class="job-collector-icon__tile" width="128" height="128" rx="4" />
  </g>

  <g class="job-collector-icon__object" data-boundary="intake-slot">
    <rect class="job-collector-icon__slot" x="40" y="19" width="48" height="14" rx="1.5" />
  </g>

  <g class="job-collector-icon__object" data-boundary="job-label">
    <text
      class="job-collector-icon__label"
      x="64"
      y="106"
      text-anchor="middle"
      textLength="118"
      lengthAdjust="spacingAndGlyphs"
    >JOB</text>
  </g>
</svg>
